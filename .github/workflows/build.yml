name: Build BizGroove

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15   # macos-14 was retired by GitHub on 2 Nov 2026
            artefact: BizGroove-macOS
          - name: Windows
            os: windows-2022
            artefact: BizGroove-Windows
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test engine
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cp -R build/BizGroove_artefacts/Release/BizGroove.app dist/
          # Ad-hoc signature so Apple Silicon will launch it; not notarised.
          codesign --force --deep --sign - dist/BizGroove.app
          ditto -c -k --keepParent dist/BizGroove.app dist/BizGroove-macOS.zip
      - name: Verify universal binary and macOS 10.13 target
        if: runner.os == 'macOS'
        run: |
          BIN=dist/BizGroove.app/Contents/MacOS/BizGroove
          ARCHS=$(lipo -archs "$BIN")
          echo "Architectures: $ARCHS"
          for a in x86_64 arm64; do
            case " $ARCHS " in
              *" $a "*) ;;
              *) echo "::error::$BIN does not contain $a"; exit 1 ;;
            esac
          done
          LOADCMDS=$(otool -arch x86_64 -l "$BIN")
          echo "$LOADCMDS" | grep -A4 -E 'LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION' || true
          if echo "$LOADCMDS" | grep -Eq '(version|minos) 10\.13([^0-9]|$)'; then
            echo "x86_64 slice targets macOS 10.13"
          else
            echo "::error::x86_64 slice does not target macOS 10.13"; exit 1
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/BizGroove_artefacts/Release/BizGroove.exe -DestinationPath dist/BizGroove-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: dist/*.zip

  publish:
    # Attach the zips to the release (published in the browser, or a pushed v* tag).
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
